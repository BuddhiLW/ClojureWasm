# Release — build the ReleaseSafe, Wasm-enabled `cljw` binary for each supported
# target on its NATIVE runner and attach it to the GitHub Release. Native builds
# (not cross-compile) keep the embedded zwasm JIT's arch-specific codegen honest.
#
# TRIGGER: build.zig.zon's `.version` is the SSOT. Every push to main runs
# `preflight`, which releases that version only when no release for it exists
# yet; pushing a `v*` tag releases that tag; manual dispatch releases whatever
# version main names (`force: true` re-releases an existing one). So a push
# that does not bump `.version` costs one short job and does nothing.
#
# The skip lives in `preflight` rather than in an `on.push.paths` filter
# because a `paths` filter also applies to tag pushes, which would drop the
# tag trigger whenever the tagged commit did not touch build.zig.zon.
#
# The deliberate human act is the version bump itself — the autonomous loop
# does not edit `.version`.
#
# NOTE (first-tag validation): the artifact build uses
# `-Dwasm -Doptimize=ReleaseSafe -Dcpu=baseline` (baseline CPU avoids SIGILL on
# shared/older hosts, the shipped/deploy config). Validate each artifact runs
# (`cljw --version` reports `(ReleaseSafe)`) on the first real release.

name: release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if one already exists for this version'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the tag to release and decide whether there is anything to do.
  # `version` comes from build.zig.zon on a branch push / dispatch, and from the
  # ref itself on a tag push.
  preflight:
    name: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve the tag and check for an existing release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Keep this reader in step with .github/versions.lock's own rule:
            # split on the first '=' and strip quotes, no inline comments.
            version=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon)
            if [[ -z "$version" ]]; then
              echo "could not read .version from build.zig.zon" >&2
              exit 1
            fi
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" != "true" ]] && gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $tag"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.name }})
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-aarch64
            runs-on: macos-15
            zig-dir: zig-aarch64-macos-0.16.0
            artifact: cljw-macos-aarch64
          - name: linux-x86_64
            runs-on: ubuntu-22.04
            zig-dir: zig-x86_64-linux-0.16.0
            artifact: cljw-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          mkdir -p ~/.local
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${{ matrix.zig-dir }}.tar.xz" -o /tmp/zig.tar.xz
          # Clear the target first so a re-run is idempotent: tar refuses to
          # overwrite existing entries ("Cannot open: File exists") and, under
          # `set -e`, delays that into a non-zero exit at the end of extraction.
          rm -rf "$HOME/.local/${{ matrix.zig-dir }}"
          tar -xJf /tmp/zig.tar.xz -C ~/.local
          echo "$HOME/.local/${{ matrix.zig-dir }}" >> "$GITHUB_PATH"

      - name: Build cljw (ReleaseSafe, Wasm-enabled, baseline CPU)
        shell: bash
        run: |
          set -euo pipefail
          zig build -Dwasm -Doptimize=ReleaseSafe -Dcpu=baseline
          zig-out/bin/cljw --version
          mkdir -p dist
          tar -C zig-out/bin -czf "dist/${{ matrix.artifact }}.tar.gz" cljw
          ( cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # `--target` makes the tag when the run came from a branch push; on a
          # tag push the tag already exists and the flag is inert.
          #
          # Create the release once; later matrix legs just upload.
          #
          # view-then-create is a TOCTOU race across the matrix: both legs can
          # see "no release" and both call create, and the loser exits non-zero
          # on "already exists", failing an otherwise-good leg under `set -e`.
          # (v1.10.0's two legs reached this 47 s apart — it was luck, not
          # design.) So treat a failed create as fine IF the release exists
          # afterwards; a create that failed for any other reason still fails
          # the step, because the trailing view then finds nothing.
          gh release view "$TAG_NAME" >/dev/null 2>&1 \
            || gh release create "$TAG_NAME" --target "$GITHUB_SHA" --title "$TAG_NAME" --generate-notes \
            || gh release view "$TAG_NAME" >/dev/null 2>&1
          gh release upload "$TAG_NAME" dist/* --clobber

  # Point `brew install buddhilw/tap/cljw` at the release this run just built.
  # Runs after BOTH matrix legs so the formula never names an asset that does
  # not exist yet; the checksums come from the .sha256 sidecars the build wrote,
  # not from a re-hash here, so the formula pins exactly what was uploaded.
  #
  # Auth is a deploy key on BuddhiLW/homebrew-tap (secret TAP_DEPLOY_KEY), not a
  # PAT: write access reaches that one repository and nothing else in the account.
  tap:
    name: bump homebrew tap
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Read the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.preflight.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sums && cd sums
          gh release download "$TAG_NAME" --pattern '*.sha256' --clobber
          # `shasum -a 256 FILE` writes "<sum>  <name>"; keep the sum alone.
          mac=$(awk '{print $1}' cljw-macos-aarch64.tar.gz.sha256)
          lin=$(awk '{print $1}' cljw-linux-x86_64.tar.gz.sha256)
          test -n "$mac" && test -n "$lin"
          {
            echo "MAC_SHA256=$mac"
            echo "LINUX_SHA256=$lin"
          } >> "$GITHUB_ENV"

      - name: Check out the tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: BuddhiLW/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Write and push the formula
        env:
          TAG_NAME: ${{ needs.preflight.outputs.tag }}
        shell: bash
        working-directory: tap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("Formula/cljw.rb")
          s = p.read_text()
          tag = os.environ["TAG_NAME"]
          version = tag.lstrip("v")
          # The formula carries no `version` line: brew scans it from the URL,
          # and `brew audit --strict` rejects stating it twice.
          s = re.sub(r'/download/v[^/]+/', '/download/%s/' % tag, s)
          # Each sha256 sits under its own url line, so replace positionally.
          for host, sha in (("macos-aarch64", os.environ["MAC_SHA256"]),
                            ("linux-x86_64",  os.environ["LINUX_SHA256"])):
              s = re.sub(r'(cljw-%s\.tar\.gz"\n      sha256 ")[0-9a-f]*(")' % host,
                         lambda m: m.group(1) + sha + m.group(2), s)
          # `brew test` asserts the installed binary reports this release.
          s, n = re.subn(r'(assert_match ")[^"]*(", shell_output\("#\{bin\}/cljw --version"\))',
                         lambda m: m.group(1) + version + m.group(2), s)
          if n != 1:
              raise SystemExit("expected 1 version assertion in the formula, rewrote %d" % n)
          # No line may name a version other than the one being released.
          stale = [l.strip() for l in s.splitlines()
                   if re.search(r'\b\d+\.\d+\.\d+\b', l) and version not in l]
          if stale:
              raise SystemExit("formula still names another version: %r" % stale)
          p.write_text(s)
          PY
          grep -q "REPLACE_" Formula/cljw.rb && { echo "formula still carries a placeholder"; exit 1; }
          git diff --quiet && { echo "formula already current for $TAG_NAME"; exit 0; }
          git config user.name "clojurewasm-release"
          git config user.email "clojurewasm-release@users.noreply.github.com"
          git commit -am "cljw $TAG_NAME"
          git push
